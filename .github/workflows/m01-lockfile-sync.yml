name: M01 Dependency Lockfile Sync

on:
  pull_request:
    paths:
      - package.json
      - apps/api/package.json
      - packages/db/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/m01-lockfile-sync.yml

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.actor == 'wpessential' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'm01/platform-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout exact M01 implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: m01/platform-foundation
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0

      - name: Reconcile dependency lockfile only
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

          unexpected="$(git status --porcelain | grep -v '^ M pnpm-lock.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected repository mutation during lockfile sync:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already reconciled.'
            exit 0
          fi

          git add pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(m01): lock database dependencies'
          git push origin HEAD:m01/platform-foundation
