services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: brovexa_dev
      POSTGRES_USER: brovexa
      POSTGRES_PASSWORD: brovexa-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brovexa -d brovexa_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - brovexa_postgres_data:/var/lib/postgresql

  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.1-alpine3.24@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brovexa_postgres_data:
