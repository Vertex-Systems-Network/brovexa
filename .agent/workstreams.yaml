version: 1

default_concurrency:
  target_agents: 6
  soft_max_agents: 8
  scale_beyond_soft_max_requires_metrics_review: true

recommended_roles:
  - integration_architecture
  - contracts_policy
  - database_persistence
  - worker_runtime
  - module_specialist
  - verification_security

states:
  - PLANNED
  - CLAIMED
  - WORKING
  - BLOCKED
  - READY_FOR_REVIEW
  - READY_FOR_INTEGRATION
  - PAUSED_FOR_SYNC
  - INTEGRATING
  - VERIFIED
  - MERGED
  - SUPERSEDED

claim_rules:
  - One active owner per work packet unless explicitly decomposed into child work packets.
  - One active coding workstream per agent by default.
  - One workstream uses one isolated branch/worktree and one PR by default.
  - An agent must not claim work whose required dependency contract is undefined.
  - A workstream behind the latest Supervisor synchronization epoch must enter PAUSED_FOR_SYNC before new feature work or completion submission.

standing_branches:
  - agent_id: SUPERVISOR
    role: integration_architecture
    module: integration_control
    branch: supervisor/integration-control
  - agent_id: AGENT-CONTRACTS
    role: contracts_policy
    module: contracts_policy
    branch: agent/contracts-policy
  - agent_id: AGENT-DB
    role: database_persistence
    module: database_persistence
    branch: agent/database-persistence
  - agent_id: AGENT-RUNTIME
    role: worker_runtime
    module: worker_runtime
    branch: agent/worker-runtime
  - agent_id: AGENT-MODULE
    role: module_specialist
    module: module_infrastructure
    branch: agent/module-infrastructure
  - agent_id: AGENT-VERIFY
    role: verification_security
    module: verification_security
    branch: agent/verification-security

active_workstreams:
  - task_id: GOVERNANCE-SUPERVISOR-WORKFLOW
    agent_id: SUPERVISOR
    owner_role: integration_architecture
    module: integration_control
    branch: supervisor/integration-control
    status: WORKING
    base_sha: "890618e28c5e300496389051b1b3d9c32880adf7"
    synced_main_sha: "890618e28c5e300496389051b1b3d9c32880adf7"
    sync_epoch: 1
    depends_on: []

handoff_required_fields:
  - task_id
  - agent_id
  - owner_role
  - status
  - base_sha
  - head_sha
  - branch
  - pull_request
  - changed_paths
  - contract_impact
  - migration_impact
  - dependency_assumptions
  - synced_main_sha
  - sync_epoch
  - verification_evidence
  - security_compliance_impact
  - shared_file_requests
  - known_limitations
  - instruction_drift_result
  - completion_signal
