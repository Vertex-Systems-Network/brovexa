packages:
  - apps/*
  - packages/*

# pnpm 11 defaults minimumReleaseAge to 1440 minutes. zod@4.5.4 is an
# explicitly reviewed, exact-version bootstrap exception; do not broaden this
# to the whole package or a wildcard without a separate dependency review.
minimumReleaseAgeExclude:
  - zod@4.5.4

# pnpm 11 blocks unreviewed dependency lifecycle scripts by default. The
# Drizzle tooling graph requires esbuild's install script. Keep this matcher
# exact to the versions currently locked; future esbuild versions require
# another dependency review rather than inheriting trust automatically.
allowBuilds:
  'esbuild@0.18.20 || 0.25.12 || 0.28.2': true
