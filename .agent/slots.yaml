version: 2
policy: supervisor-assigned-main-first-static-definitions

start_rule:
  required_start_branch: main
  require_exact_current_main_sha: true
  new_agent_must_not_start_on_module_branch: true

live_registry:
  issue_number: 53
  name: AI-Native Plan Live Agent Slot Registry
  state_authority: github-issue-53-body
  require_reread_before_assignment: true
  require_reread_after_assignment: true
  registry_revision_monotonic: true
  synchronization_source: github-issue-50-latest-supervisor-broadcast

assignment_authority:
  role: SUPERVISOR
  serialized_onboarding_decisions: true
  plan_path: docs/AI_NATIVE_PLAN.md
  slot_definitions_path: .agent/slots.yaml
  live_slot_registry_issue: 53

rejection:
  exact_phrase: "Go Home Come Back Next Time"
  when: no-open-slot-in-live-registry
  effects:
    - no-module-assignment
    - no-module-branch-checkout
    - no-work-packet
    - no-feature-edits
    - no-agent-pr

live_slot_states:
  - OPEN
  - OCCUPIED

live_start_statuses:
  - WAITING
  - ASSIGNED
  - WORKING
  - PAUSED_FOR_SYNC

rules:
  - This file defines standing slot identities and branches; it does not store live occupancy.
  - A new agent always initializes from the exact current main SHA before the Supervisor checks capacity.
  - The Supervisor reads docs/AI_NATIVE_PLAN.md, this definition registry, issue #53 live occupancy, and issue #50 synchronization state before assigning a new agent.
  - Only a live issue #53 slot whose status is OPEN and whose static definition is assignable may be assigned.
  - The selected standing branch must be synchronized to the current main SHA and latest Supervisor sync epoch before the agent switches to it.
  - The Supervisor updates issue #53 with the agent name, OCCUPIED status, start status, main SHA, sync epoch, and incremented registry revision before feature work begins.
  - The Supervisor re-reads issue #53 after the update and confirms the assignment before handing the branch/work packet to the agent.
  - One slot may have only one live assigned agent; onboarding decisions are serialized by the Supervisor.
  - If all assignable live slots are OCCUPIED the Supervisor responds exactly with the rejection phrase and stops onboarding without creating work.
  - New-agent arrival does not create extra capacity or a new module branch. Extra slots must be planned and bootstrapped in a governance change before they can appear in issue #53.
  - Releasing a slot is an explicit Supervisor live-registry transaction after the assigned agent has no active work packet or unmerged branch work for that slot.
  - Live assignment/release does not require a repository governance PR when standing slot definitions and rules are unchanged.

slots:
  - slot_id: SUPERVISOR
    module: integration_control
    branch: supervisor/integration-control
    assignable_to_new_agent: false
  - slot_id: CONTRACTS
    module: contracts_policy
    branch: agent/contracts-policy
    assignable_to_new_agent: true
  - slot_id: DATABASE
    module: database_persistence
    branch: agent/database-persistence
    assignable_to_new_agent: true
  - slot_id: RUNTIME
    module: worker_runtime
    branch: agent/worker-runtime
    assignable_to_new_agent: true
  - slot_id: MODULE
    module: module_infrastructure
    branch: agent/module-infrastructure
    assignable_to_new_agent: true
  - slot_id: VERIFY
    module: verification_security
    branch: agent/verification-security
    assignable_to_new_agent: true
