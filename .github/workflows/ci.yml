name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck, test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0 — immutable commit pin.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Verify foundation contract
        run: node scripts/verify-foundation.mjs

      - name: Test foundation guardrails
        run: node scripts/verify-foundation.test.mjs

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run runtime quality gate
        run: pnpm run quality:runtime

      - name: Verify API source-to-runtime reload loop
        run: pnpm run verify:dev-api
