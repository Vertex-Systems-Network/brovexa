name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck, test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Verify foundation contract
        run: node scripts/verify-foundation.mjs

      - name: Test foundation guardrails
        run: node scripts/verify-foundation.test.mjs

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run runtime quality gate
        run: pnpm run quality:runtime

      - name: Verify API source-to-runtime reload loop
        run: pnpm run verify:dev-api

  database:
    name: PostgreSQL 18 migration integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: brovexa_m01_test
          POSTGRES_USER: brovexa
          POSTGRES_PASSWORD: brovexa-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brovexa -d brovexa_m01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL migration/data-layer contract
        run: pnpm run verify:db
        env:
          DATABASE_URL: postgresql://brovexa:brovexa-test-only@127.0.0.1:5432/brovexa_m01_test
          BROVEXA_DB_TEST_ALLOW_RESET: "true"
