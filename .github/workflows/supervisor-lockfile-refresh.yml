name: Supervisor Lockfile Refresh

on:
  push:
    branches:
      - supervisor/integration-control

permissions:
  contents: write

concurrency:
  group: supervisor-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Supervisor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: supervisor/integration-control
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.20.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.23.0
      - name: Refresh lockfile from committed override
        run: pnpm install --lockfile-only
      - name: Verify patched dependency resolution
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm why multer
          pnpm run audit:dependencies
      - name: Commit lockfile only
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh lockfile for multer 2.3.0"
          git push origin HEAD:supervisor/integration-control
