name: Persistent Supervisor Control Plane

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created]
  issues:
    types: [edited]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read
  statuses: write

concurrency:
  group: persistent-supervisor-control-plane
  cancel-in-progress: false

jobs:
  supervisor-heartbeat:
    name: supervisor-heartbeat
    if: ${{ github.event_name != 'issues' || github.event.issue.number != 101 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect repository and maintain Supervisor control state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statusTitle = '[Supervisor] Persistent Control Plane Status';
            const heartbeatBudgetMinutes = 15;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const nowDate = new Date();
            const now = nowDate.toISOString();
            const validUntil = new Date(nowDate.getTime() + heartbeatBudgetMinutes * 60_000).toISOString();
            const expectedSlots = ['SUPERVISOR', 'CONTRACTS', 'DATABASE', 'RUNTIME', 'MODULE', 'VERIFY'];

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${repository.default_branch}`,
            });
            const liveMain = mainRef.object.sha;
            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.default_branch,
            });
            const mainProtected = Boolean(defaultBranch.protected);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            let statusIssue = issues.find((issue) => !issue.pull_request && issue.title === statusTitle);
            const previousHeartbeat = statusIssue?.body?.match(/Last heartbeat:\s*`([^`]+)`/i)?.[1] || null;
            let previousHeartbeatGapMinutes = null;
            if (previousHeartbeat) {
              const previousMs = new Date(previousHeartbeat).getTime();
              if (Number.isFinite(previousMs)) {
                previousHeartbeatGapMinutes = Math.max(0, Math.round((nowDate.getTime() - previousMs) / 60_000));
              }
            }

            const { data: slotRegistry } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: 53,
            });
            const registryBody = slotRegistry.body || '';
            const registryMain = registryBody.match(/Live main baseline:\s*`([0-9a-f]{40})`/i)?.[1] || null;
            const registryEpoch = Number(registryBody.match(/Sync epoch:\s*`?(\d+)`?/i)?.[1] || 0);

            const slots = new Map();
            for (const line of registryBody.split('\n')) {
              if (!line.trim().startsWith('|')) continue;
              const cells = line
                .split('|')
                .slice(1, -1)
                .map((cell) => cell.trim().replace(/^`|`$/g, ''));
              if (cells.length < 7 || !expectedSlots.includes(cells[0])) continue;
              slots.set(cells[0], {
                slot: cells[0],
                branch: cells[1],
                status: cells[2],
                assignedAgent: cells[3],
                startStatus: cells[4],
                assignedMain: cells[5],
                epoch: Number(cells[6]),
              });
            }

            const broadcastComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: 50,
              per_page: 100,
            });
            let broadcastEpoch = 0;
            let broadcastMain = null;
            for (const comment of broadcastComments) {
              const body = comment.body || '';
              const epoch = Number(body.match(/Sync epoch:\s*`?(\d+)`?/i)?.[1] || 0);
              if (epoch >= broadcastEpoch) {
                const sha = body.match(/(?:Resulting main SHA|Resulting main|Live main):\s*`([0-9a-f]{40})`/i)?.[1] || null;
                if (epoch > 0) {
                  broadcastEpoch = epoch;
                  broadcastMain = sha || broadcastMain;
                }
              }
            }

            const leaseFiles = new Map();
            try {
              const { data: leaseListing } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.leases',
                ref: 'coordination/leases',
              });
              if (Array.isArray(leaseListing)) {
                for (const item of leaseListing) {
                  const slot = String(item.name || '').replace(/\.json$/i, '');
                  if (!expectedSlots.includes(slot)) continue;
                  const { data: leaseFile } = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: `.leases/${slot}.json`,
                    ref: 'coordination/leases',
                  });
                  if (!Array.isArray(leaseFile) && typeof leaseFile.content === 'string') {
                    const decoded = Buffer.from(leaseFile.content.replace(/\n/g, ''), 'base64').toString('utf8');
                    try {
                      leaseFiles.set(slot, JSON.parse(decoded));
                    } catch {
                      leaseFiles.set(slot, { __parseError: true });
                    }
                  }
                }
              }
            } catch (error) {
              core.warning(`Could not inspect coordination leases: ${error.message}`);
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: repository.default_branch,
              per_page: 100,
            });

            const reviewReady = [];
            const staleSignals = [];
            const waitingForCi = [];

            for (const pr of pulls) {
              if (pr.draft) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const signals = comments.filter((comment) => (comment.body || '').trim() === 'Work Done and Submitted');
              if (!signals.length) continue;

              const latestSignal = signals.at(-1);
              const { data: headCommit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: pr.head.sha,
              });
              const headTime = new Date(headCommit.commit.committer?.date || headCommit.commit.author?.date || 0).getTime();
              const signalTime = new Date(latestSignal.created_at).getTime();
              if (!(signalTime >= headTime)) {
                staleSignals.push(`#${pr.number}`);
                continue;
              }

              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: pr.head.sha,
                event: 'pull_request',
                per_page: 100,
              });
              const ciRun = workflowRuns
                .filter((run) => run.name === 'CI' && run.head_sha === pr.head.sha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!ciRun || ciRun.status !== 'completed' || ciRun.conclusion !== 'success') {
                waitingForCi.push(`#${pr.number}`);
                continue;
              }

              reviewReady.push(`#${pr.number}`);
              const marker = `<!-- persistent-supervisor:review-ready:${pr.head.sha} -->`;
              const alreadyMarked = comments.some((comment) => (comment.body || '').includes(marker));
              if (!alreadyMarked) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: `${marker}\nPersistent Supervisor detected a fresh head-bound completion signal and successful exact-head CI for \`${pr.head.sha}\`.\n\n**READY_FOR_SUPERVISOR_REVIEW** — this is a deterministic triage signal only. It is not approval and does not authorize automatic merge; lease, slot, dependency, migration/shared-path, review-thread and expected-head checks remain mandatory.`,
                });
              }
            }

            const drift = [];
            const slotObservations = [];

            if (!mainProtected) {
              drift.push(`native GitHub protection is disabled for ${repository.default_branch}`);
            }
            if (registryMain && registryMain !== liveMain) {
              drift.push(`issue #53 main baseline ${registryMain} != live main ${liveMain}`);
            }
            if (broadcastEpoch && registryEpoch && broadcastEpoch !== registryEpoch) {
              drift.push(`issue #50 epoch ${broadcastEpoch} != issue #53 epoch ${registryEpoch}`);
            }
            if (broadcastMain && registryMain && broadcastMain !== registryMain) {
              drift.push(`issue #50 main ${broadcastMain} != issue #53 main ${registryMain}`);
            }
            if (previousHeartbeatGapMinutes !== null && previousHeartbeatGapMinutes > heartbeatBudgetMinutes) {
              drift.push(`previous heartbeat gap ${previousHeartbeatGapMinutes}m exceeded ${heartbeatBudgetMinutes}m freshness budget`);
            }

            for (const slotId of expectedSlots) {
              const row = slots.get(slotId);
              if (!row) {
                drift.push(`${slotId} is missing from issue #53 registry`);
                continue;
              }

              let branchHead = null;
              let branchContainsMain = false;
              try {
                const { data: branch } = await github.rest.repos.getBranch({
                  owner,
                  repo,
                  branch: row.branch,
                });
                branchHead = branch.commit.sha;
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: liveMain,
                  head: branchHead,
                });
                branchContainsMain = ['ahead', 'identical'].includes(comparison.status);
              } catch (error) {
                drift.push(`${slotId} branch ${row.branch} could not be verified: ${error.message}`);
              }

              const lease = leaseFiles.get(slotId) || null;
              if (row.status === 'OPEN') {
                if (lease) {
                  drift.push(`${slotId} is OPEN but an active lease file still exists`);
                }
                if (row.assignedMain !== liveMain || row.epoch !== registryEpoch) {
                  drift.push(`${slotId} OPEN baseline is stale (${row.assignedMain || 'unparsed'} / epoch ${row.epoch || 'unparsed'})`);
                }
                if (branchHead && !branchContainsMain) {
                  drift.push(`${slotId} OPEN standing branch ${row.branch} does not contain live main ${liveMain}`);
                }
              } else if (row.status === 'OCCUPIED') {
                if (!lease) {
                  drift.push(`${slotId} is OCCUPIED but has no active lease`);
                } else if (lease.__parseError) {
                  drift.push(`${slotId} lease JSON is invalid`);
                } else {
                  if (lease.state !== 'ACTIVE') drift.push(`${slotId} lease state is ${lease.state || 'missing'}, expected ACTIVE`);
                  if (lease.slot_id !== slotId) drift.push(`${slotId} lease slot_id mismatch`);
                  if (lease.branch !== row.branch) drift.push(`${slotId} lease branch ${lease.branch || 'missing'} != registry ${row.branch}`);
                  if (lease.synced_main_sha !== row.assignedMain) drift.push(`${slotId} lease main ${lease.synced_main_sha || 'missing'} != registry ${row.assignedMain}`);
                  if (Number(lease.sync_epoch) !== row.epoch) drift.push(`${slotId} lease epoch ${lease.sync_epoch ?? 'missing'} != registry ${row.epoch}`);
                }
                if (row.assignedMain !== liveMain || row.epoch !== registryEpoch) {
                  drift.push(`${slotId} occupied slot has not synchronized to current main/epoch`);
                }
                if (branchHead && !branchContainsMain) {
                  drift.push(`${slotId} occupied branch ${row.branch} does not contain live main ${liveMain}`);
                }
              } else {
                drift.push(`${slotId} has unsupported registry status ${row.status || 'missing'}`);
              }

              slotObservations.push(`${slotId}:${row.status}@${row.epoch || '?'} lease=${lease ? 'yes' : 'no'} branch=${branchContainsMain ? 'synced' : 'stale'}`);
            }

            const state = drift.length ? 'DEGRADED' : 'HEALTHY';
            const list = (items) => items.length ? items.join(', ') : 'none';
            const body = [
              '# Persistent Supervisor Control Plane',
              '',
              `State: **${state}**`,
              `Last heartbeat: \`${now}\``,
              `Health valid until: \`${validUntil}\``,
              `Workflow run: ${runUrl}`,
              '',
              `> Freshness rule: if current time is later than \`${validUntil}\`, treat this status as **STALE / DEGRADED** even if the displayed state above says HEALTHY. GitHub scheduled workflows are best-effort and are not a real-time daemon.`,
              '',
              '## Security and coordination snapshot',
              `- live \`${repository.default_branch}\`: \`${liveMain}\``,
              `- native main protection: ${mainProtected ? 'enabled' : 'DISABLED'}`,
              `- issue #53 baseline: \`${registryMain || 'unparsed'}\``,
              `- issue #53 sync epoch: \`${registryEpoch || 'unparsed'}\``,
              `- latest issue #50 sync epoch: \`${broadcastEpoch || 'unparsed'}\``,
              `- latest issue #50 main: \`${broadcastMain || 'unparsed'}\``,
              `- previous heartbeat gap: ${previousHeartbeatGapMinutes === null ? 'unknown' : `${previousHeartbeatGapMinutes}m`}`,
              '',
              '## Slot integrity',
              slotObservations.length ? slotObservations.map((item) => `- ${item}`).join('\n') : '- no slot rows parsed',
              '',
              '## Open work queue',
              `- open PRs to \`${repository.default_branch}\`: ${pulls.length}`,
              `- ready for Supervisor review: ${list(reviewReady)}`,
              `- fresh completion signal waiting for CI: ${list(waitingForCi)}`,
              `- stale completion signal: ${list(staleSignals)}`,
              '',
              '## Drift / security findings',
              drift.length ? drift.map((item) => `- ${item}`).join('\n') : '- none detected',
              '',
              'This issue is maintained by GitHub Actions. The Action observes and triages existing repository governance; it does not auto-release leases, overwrite slot ownership, weaken FULL GATE, bypass branch protection, auto-merge, or silently take over another agent instance.',
            ].join('\n');

            if (!statusIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: statusTitle,
                body,
              });
              statusIssue = created.data;
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: statusIssue.number,
                state: 'open',
                body,
              });
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: liveMain,
              state: drift.length ? 'failure' : 'success',
              context: 'persistent-supervisor',
              description: drift.length ? 'Supervisor security/coordination drift detected' : 'Supervisor control plane healthy',
              target_url: runUrl,
            });

            core.summary
              .addHeading('Persistent Supervisor')
              .addTable([
                [{ data: 'State', header: true }, state],
                [{ data: 'Live main', header: true }, liveMain],
                [{ data: 'Native protection', header: true }, mainProtected ? 'enabled' : 'DISABLED'],
                [{ data: 'Sync epoch', header: true }, String(registryEpoch || broadcastEpoch || 'unknown')],
                [{ data: 'Heartbeat gap', header: true }, previousHeartbeatGapMinutes === null ? 'unknown' : `${previousHeartbeatGapMinutes}m`],
                [{ data: 'Review ready', header: true }, list(reviewReady)],
                [{ data: 'Waiting CI', header: true }, list(waitingForCi)],
                [{ data: 'Stale signals', header: true }, list(staleSignals)],
              ])
              .write();
